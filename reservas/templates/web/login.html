{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Sistema de Reservas UPB Santa Cruz</title>
    <!-- Google Fonts -->
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- UPB Logo & Header -->
            <div class="logo-container">
                <img class="logo-img" src="https://www.upbvirtual.net/upbvirtual/pluginfile.php/1/theme_adaptable/logo/1785874399/2xlogo_2.png" alt="Universidad Privada Boliviana">
                <h1 class="title">Sistema de Reservas</h1>
                <p class="subtitle">UPB Santa Cruz • Campus</p>
            </div>

            {% if error_mensaje %}
            <div class="alert-error">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error_mensaje }}</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" id="loginForm">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="username">Usuario o Correo Institucional</label>
                    <input type="text" id="username" name="username" class="input-control"
                        placeholder="Ej: sbarrientos o hzuniga" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="input-control" placeholder="••••••••"
                        required>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Ingresar al Sistema</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </form>

            <!-- Acceso Rápido con Poderes Especiales -->
            <div class="quick-access-section">
                <div class="quick-access-title">⚡ Acceso Rápido Demo / Equipo con Poderes</div>
                <div class="quick-badges-grid">
                    <button type="button" class="quick-btn admin" onclick="autocompletar('sbarrientos', 'password')">
                        <span class="crown-icon">👑</span>
                        <span>Prof. Sergio B.</span>
                    </button>
                    <button type="button" class="quick-btn admin" onclick="autocompletar('hzuniga', 'password')">
                        <span class="crown-icon">👑</span>
                        <span>Hugo Zúñiga</span>
                    </button>
                    <button type="button" class="quick-btn admin" onclick="autocompletar('rvaca', 'password')">
                        <span class="crown-icon">👑</span>
                        <span>Raúl Vaca</span>
                    </button>
                    <button type="button" class="quick-btn admin" onclick="autocompletar('aparraga', 'password')">
                        <span class="crown-icon">👑</span>
                        <span>Alejandro P.</span>
                    </button>
                    <button type="button" class="quick-btn admin" onclick="autocompletar('admin', 'password')">
                        <span class="crown-icon">👑</span>
                        <span>SuperAdmin</span>
                    </button>
                    <button type="button" class="quick-btn" onclick="autocompletar('lucia.mendez', 'password')">
                        <span>🎓</span>
                        <span>Lucía (Estudiante)</span>
                    </button>
                </div>
            </div>
        </div>

        <p class="footer-note">Universidad Privada Boliviana — Excelencia que trasciende</p>
    </div>

    <script>
        function autocompletar(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('loginForm').submit();
        }
    </script>
</body>

</html>
