<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión — Reservas UPB</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 300px; }
        h1 { font-size: 1.2rem; margin-bottom: 1rem; }
        label { display: block; margin-top: 0.75rem; font-size: 0.9rem; }
        input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; width: 100%; padding: 0.6rem; background: #004b8d; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .errorlist { color: red; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reserva de Salas — UPB</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
